<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Basketball scoreboard</title>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    </head>
    <body>
        <!-- NEW: Timer Widget Container -->
        <div class="timer-container">
            <h1 id="timer-display">12:00</h1>
            <div class="timer-controls">
                <button id="start-pause-btn" onclick="toggleTimer()">START</button>
            </div>
        </div>
        <div class="container">
            <div class="column">
                <h2>HOME</h2>
                <h3 class="Score" id="resultHomeScore">0</h3>
                <div class="CTA">
                    <button class="Hscore" onclick="addupH1()">+1</button>
                    <button class="Hscore" onclick="addupH2()">+2</button>
                    <button class="Hscore" onclick="addupH3()">+3</button>
                </div>
            </div>
            <div class="column">
                <h2>GUEST</h2>
                <h3 class="Score" id="resultGuestScore">0</h3>
                <div class="CTA">
                    <button class="Gscore" onclick="addupG1()">+1</button>
                    <button class="Gscore" onclick="addupG2()">+2</button>
                    <button class="Gscore" onclick="addupG3()">+3</button>
                </div>
            </div>
        </div>
                <!-- NEW: Reset Button Container -->
        <div class="reset-container">
            <button id="reset-btn" onclick="resetGame()">RESET GAME</button>
        </div>
        <script src="index.js"></script>
    </body>
</html>
